AWSTemplateFormatVersion: "2010-09-09"
Description: JIT Access Manager - Phase 3 monitoring (failed-revocation alarm)

Parameters:
  Project:
    Type: String
    Default: jit-access
  Environment:
    Type: String
    Default: dev

Resources:
  # Fires if revoke_access ever raises. The Lambda deliberately re-raises on
  # genuine IAM failures, so any Errors datapoint means a grant may still be live.
  RevokeFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-${Environment}-revoke-failed"
      AlarmDescription: >-
        revoke_access raised an error. A privileged grant may not have been
        removed. Check the Lambda logs and the target role's inline policies.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${Project}-${Environment}-revoke-access"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-${Environment}-NotificationsTopicArn"

  # Alerts when the cleanup reconciler raises an unhandled error.
  ReconcileCleanupFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-${Environment}-reconcile-cleanup-failed"
      AlarmDescription: >-
        The cleanup reconciler raised an error. Check its Lambda logs and
        verify that pending access-policy cleanup is progressing.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${Project}-${Environment}-reconcile-cleanup"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-${Environment}-NotificationsTopicArn"

  # Alerts when activate_access raises (for example, a failed PutRolePolicy).
  ActivateAccessFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Project}-${Environment}-activate-failed"
      AlarmDescription: >-
        activate_access raised an error. A scheduled grant may not have been
        applied, so the requester may have no access for their window. Check
        the Lambda logs and the request status in DynamoDB.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${Project}-${Environment}-activate-access"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Fn::ImportValue: !Sub "${Project}-${Environment}-NotificationsTopicArn"

Outputs:
  RevokeFailureAlarmName:
    Value: !Ref RevokeFailureAlarm
  ReconcileCleanupFailureAlarmName:
    Value: !Ref ReconcileCleanupFailureAlarm
  ActivateAccessFailureAlarmName:
    Value: !Ref ActivateAccessFailureAlarm
