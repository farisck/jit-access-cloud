name: JIT Access CI

on:
push:

jobs:
test:
runs-on: ubuntu-latest

```
env:
  AWS_DEFAULT_REGION: us-east-1
  REQUESTS_TABLE_NAME: ci-test-table
  NOTIFICATIONS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ci-test-topic
  TARGET_ROLE_NAME: ci-test-target-role
  REVOKE_FUNCTION_ARN: arn:aws:lambda:us-east-1:000000000000:function:ci-test-revoke
  SCHEDULER_ROLE_ARN: arn:aws:iam::000000000000:role/ci-test-scheduler-role
  SCHEDULE_GROUP_NAME: ci-test-schedule-group
  PERMISSION_CATALOG: '["s3-read-demo-bucket", "dynamodb-read-requests"]'

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: List project files
    run: ls

  - name: Check Python version
    run: python --version

  - name: Install Python dependencies
    run: pip install boto3 coverage

  - name: Test Lambda imports
    run: |
      python -c "import sys; sys.path.insert(0, 'lambda/approve_access'); import app"
      python -c "import sys; sys.path.insert(0, 'lambda/list_requests'); import app"
      python -c "import sys; sys.path.insert(0, 'lambda/request_access'); import app"
      python -c "import sys; sys.path.insert(0, 'lambda/revoke_access'); import app"

  - name: Check Python syntax
    run: python -m compileall lambda

  - name: Run unit tests with coverage
    run: python -m coverage run --include="lambda/*/app.py" -m unittest discover -s tests -v

  - name: Display coverage report
    if: always()
    run: python -m coverage report -m
```
