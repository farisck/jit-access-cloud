name: JIT Access CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      AWS_DEFAULT_REGION: us-east-1
      REQUESTS_TABLE_NAME: ci-test-table
      NOTIFICATIONS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:ci-test-topic

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List project files
        run: ls

      - name: Check Python version
        run: python --version

      - name: Install Python dependencies
        run: pip install boto3

      - name: Test Lambda imports
        run: |
          python -c "import sys; sys.path.insert(0, 'lambda/approve_access'); import app"
          python -c "import sys; sys.path.insert(0, 'lambda/list_requests'); import app"
          python -c "import sys; sys.path.insert(0, 'lambda/request_access'); import app"
          python -c "import sys; sys.path.insert(0, 'lambda/revoke_access'); import app"

      - name: Check Python syntax
        run: python -m compileall lambda